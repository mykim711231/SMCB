<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#2563EB" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f1115" />
    <meta name="description" content="새문안교회 중국어 성경반(중급) 학습 PWA" />
    <!-- iOS standalone PWA — 홈 화면에서 띄울 때 풀스크린, 시스템 상태바 유지 -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SMCB 中文" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icons/icon.svg" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/icon.svg" />
    <title>새문안교회 중국어 성경반(중급)</title>
    <!--
      Critical inline CSS — iOS PWA cold start 흰 화면 방지.
      Tailwind 가 들어있는 JS 번들은 파싱·실행까지 수백 ms~수 초가 걸린다.
      그 사이 body 가 기본 흰색으로 보이는 것을 막기 위해 토큰과 동일한
      brand 배경색을 인라인으로 선언한다. .dark 클래스는 settings hydrate
      이후에야 붙으므로, 첫 paint 까지는 prefers-color-scheme 으로 결정.
      값은 tokens.css 의 --rgb-bg / --rgb-text 와 1:1 일치.
    -->
    <style>
      html, body {
        margin: 0;
        background-color: #fafafa;
        color: #17171b;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      @media (prefers-color-scheme: dark) {
        html, body {
          background-color: #0f1115;
          color: #e6e8ec;
        }
      }
      /* Boot splash — #root 내부에 두면 React 첫 render 가 자연 교체한다.
         별도 제거 로직 불필요. */
      .boot-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background-color: #fafafa;
      }
      @media (prefers-color-scheme: dark) {
        .boot-splash { background-color: #0f1115; }
      }
      .boot-splash__icon {
        width: 72px;
        height: 72px;
        opacity: 0.95;
      }
      .boot-splash__spinner {
        width: 22px;
        height: 22px;
        border: 2px solid rgba(37, 99, 235, 0.18);
        border-top-color: #2563EB;
        border-radius: 50%;
        animation: boot-splash-spin 0.8s linear infinite;
      }
      @keyframes boot-splash-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-bg text-fg">
    <div id="root">
      <div class="boot-splash" aria-hidden="true">
        <img src="%BASE_URL%icons/icon.svg" alt="" class="boot-splash__icon" />
        <div class="boot-splash__spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
