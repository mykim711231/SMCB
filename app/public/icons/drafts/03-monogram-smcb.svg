<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SMCB 시안3 - 모노그램 리파인">
  <defs>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#g3)"/>
  <!-- 원형 가이드 -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#FFFFFF" stroke-width="3" opacity="0.25"/>
  <circle cx="256" cy="256" r="165" fill="none" stroke="#FFFFFF" stroke-width="1" opacity="0.4"/>
  <!-- SMCB 모노그램 -->
  <text x="256" y="232" font-family="-apple-system, Segoe UI, Roboto, sans-serif" font-size="108" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="-4">SMCB</text>
  <!-- 中级 부제 -->
  <text x="256" y="330" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="64" font-weight="700" fill="#FBBF24" text-anchor="middle" letter-spacing="6">中级</text>
  <!-- 작은 십자가 액센트 -->
  <g transform="translate(256 380)" fill="#FFFFFF" opacity="0.9">
    <rect x="-3" y="-14" width="6" height="28" rx="2"/>
    <rect x="-12" y="-3" width="24" height="6" rx="2"/>
  </g>
