<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="SMCB 시안4 - 서예 中">
  <!-- 한지 느낌의 따뜻한 배경 -->
  <rect width="512" height="512" rx="112" fill="#FEF3C7"/>
  <rect width="512" height="512" rx="112" fill="url(#paper)" opacity="0.6"/>
  <defs>
    <radialGradient id="paper" cx="0.3" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#F59E0B" stop-opacity="0.15"/>
    </radialGradient>
  </defs>
  <!-- 인장처럼 빨간 박스 -->
  <rect x="380" y="380" width="92" height="92" rx="8" fill="#DC2626"/>
  <text x="426" y="442" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="56" font-weight="900" fill="#FFFFFF" text-anchor="middle">圣</text>
  <!-- 큰 붓글씨 中 -->
  <text x="240" y="380" font-family="KaiTi, STKaiti, Microsoft YaHei, sans-serif" font-size="380" font-weight="900" fill="#1F2937" text-anchor="middle">中</text>
</svg>
